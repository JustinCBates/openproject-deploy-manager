project_name: test-deployment
environment: development

# Domain configuration for Caddy
domain: localhost
ssl_enabled: false

services:
  web:
    image: nginx:alpine
    port: 8080
    host_port: 80
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: 80
    healthcheck:
      enabled: true
      path: /
      interval: 5s

  redis:
    image: redis:alpine
    port: 6379
    healthcheck:
      enabled: true
      interval: 5s

network:
  name: testnet
  driver: bridge

volumes:
  redis_data:
    driver: local

deployment:
  pull_images: true
  startup_timeout: 60
  health_check_timeout: 30

proxy:
  enabled: false
