# Control Flow Specification - Deploy Manager
# Comprehensive deployment orchestration with health checking and rollback
# Generated from DEPLOY_MANAGER_PROPOSAL.md - October 15, 2025

component:
  name: "deploy-manager"
  description: "Docker Compose deployment orchestration with validation, health checking, and rollback"
  version: "1.0.0"
  repository: "openproject-deploy-manager"

# ==============================================================================
# PHASES - Sequential deployment workflow
# ==============================================================================

phases:
  phase_1_preflight:
    sequence: 10
    name: "Preflight Validation"
    description: "Validate environment and configuration before deployment"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Load Configuration"
        description: "Load deployment configuration from config-manager output"
        status: "PLANNED"
        units:
          - "config.config_loader"
        outputs:
          - "deployment_config.yml"
      
      - sequence: 20
        name: "Validate Configuration"
        description: "Validate configuration completeness and correctness"
        status: "PLANNED"
        units:
          - "config.config_validator"
        outputs:
          - "config_validation_result.yml"
      
      - sequence: 30
        name: "Check Docker Daemon"
        description: "Verify Docker daemon is accessible and running"
        status: "PLANNED"
        units:
          - "docker.docker_checker"
        outputs:
          - "docker_status.yml"
      
      - sequence: 40
        name: "Check Port Availability"
        description: "Ensure required ports are available"
        status: "PLANNED"
        units:
          - "network.port_checker"
        outputs:
          - "port_availability.yml"
      
      - sequence: 50
        name: "Run Prober Preflight"
        description: "Execute docker-prober-utility for preflight validation (optional)"
        status: "PLANNED"
        units:
          - "prober.prober_runner"
        outputs:
          - "prober_results.yml"
        conditional: true
      
      - sequence: 60
        name: "Validate System Resources"
        description: "Check system has sufficient memory, disk, CPU"
        status: "PLANNED"
        units:
          - "system.resource_checker"
        outputs:
          - "resource_check.yml"
    
    outputs:
      directory: "outputs/preflight"
      files:
        - "preflight_validation.yml"
        - "deployment_config.yml"

  phase_2_template_rendering:
    sequence: 20
    name: "Template Rendering"
    description: "Render deployment templates with configuration values"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Extract Template Variables"
        description: "Extract and prepare variables for template rendering"
        status: "PLANNED"
        units:
          - "config.variable_extractor"
        outputs:
          - "template_variables.yml"
      
      - sequence: 20
        name: "Render Caddyfile"
        description: "Render Caddyfile template for reverse proxy"
        status: "PLANNED"
        units:
          - "templates.jinja_renderer"
          - "templates.template_filters"
        outputs:
          - "Caddyfile"
      
      - sequence: 30
        name: "Render Docker Compose Override"
        description: "Render docker-compose.override.yml with dynamic settings"
        status: "PLANNED"
        units:
          - "templates.jinja_renderer"
        outputs:
          - "docker-compose.override.yml"
      
      - sequence: 40
        name: "Validate Rendered Templates"
        description: "Validate syntax and completeness of rendered templates"
        status: "PLANNED"
        units:
          - "templates.template_validator"
        outputs:
          - "template_validation.yml"
    
    outputs:
      directory: "outputs/templates"
      files:
        - "Caddyfile"
        - "docker-compose.override.yml"
        - "rendered_templates/"

  phase_3_snapshot:
    sequence: 30
    name: "Snapshot Creation"
    description: "Create pre-deployment snapshot for rollback capability"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Capture Container States"
        description: "Capture current container states and configurations"
        status: "PLANNED"
        units:
          - "docker.state_capturer"
        outputs:
          - "container_states.json"
      
      - sequence: 20
        name: "Backup Configuration Files"
        description: "Backup current configuration files"
        status: "PLANNED"
        units:
          - "snapshot.config_backupper"
        outputs:
          - "config_backup/"
      
      - sequence: 30
        name: "Store Snapshot"
        description: "Store snapshot with metadata and timestamp"
        status: "PLANNED"
        units:
          - "snapshot.snapshot_storer"
        outputs:
          - "snapshot_metadata.json"
    
    outputs:
      directory: "outputs/snapshots/<timestamp>"
      files:
        - "snapshot_metadata.json"
        - "container_states.json"
        - "config_backup/"

  phase_4_deployment:
    sequence: 40
    name: "Deployment Execution"
    description: "Execute Docker Compose deployment"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Generate Environment File"
        description: "Convert configuration to .env format for Docker Compose"
        status: "PLANNED"
        units:
          - "config.env_generator"
        outputs:
          - ".env"
      
      - sequence: 20
        name: "Pull Docker Images"
        description: "Pull required Docker images (if requested)"
        status: "PLANNED"
        units:
          - "docker.image_puller"
        outputs:
          - "image_pull_results.yml"
        conditional: true
      
      - sequence: 30
        name: "Execute Compose Up"
        description: "Run docker-compose up -d to start services"
        status: "PLANNED"
        units:
          - "docker.compose_executor"
        outputs:
          - "compose_execution.yml"
      
      - sequence: 40
        name: "Monitor Service Startup"
        description: "Monitor services starting and capture initial logs"
        status: "PLANNED"
        units:
          - "docker.startup_monitor"
        outputs:
          - "startup_logs.txt"
    
    outputs:
      directory: "outputs/deployment"
      files:
        - ".env"
        - "deployment_logs.txt"
        - "compose_execution.yml"

  phase_5_health_verification:
    sequence: 50
    name: "Health Verification"
    description: "Verify deployment health and service availability"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Check Container Health"
        description: "Verify all containers are healthy via Docker health checks"
        status: "PLANNED"
        units:
          - "health.container_health_checker"
        outputs:
          - "container_health.yml"
      
      - sequence: 20
        name: "Probe HTTP/HTTPS Endpoints"
        description: "Test HTTP/HTTPS endpoints are responding"
        status: "PLANNED"
        units:
          - "health.endpoint_prober"
        outputs:
          - "endpoint_results.yml"
      
      - sequence: 30
        name: "Check Database Connectivity"
        description: "Verify database is accessible and responding"
        status: "PLANNED"
        units:
          - "health.database_checker"
        outputs:
          - "database_health.yml"
        conditional: true
      
      - sequence: 40
        name: "Test Service Connectivity"
        description: "Test inter-service connectivity and networking"
        status: "PLANNED"
        units:
          - "health.connectivity_tester"
        outputs:
          - "connectivity_results.yml"
    
    outputs:
      directory: "outputs/health"
      files:
        - "health_report.json"
        - "service_status.yml"

  phase_6_post_deployment:
    sequence: 60
    name: "Post-Deployment"
    description: "Finalize deployment and cleanup"
    status: "PLANNED"
    steps:
      - sequence: 10
        name: "Report Deployment Status"
        description: "Generate and report final deployment status"
        status: "PLANNED"
        units:
          - "reporting.status_reporter"
        outputs:
          - "deployment_result.json"
      
      - sequence: 20
        name: "Log Deployment Metadata"
        description: "Log deployment metadata for audit trail"
        status: "PLANNED"
        units:
          - "reporting.metadata_logger"
        outputs:
          - "deployment_manifest.yml"
      
      - sequence: 30
        name: "Cleanup Temporary Files"
        description: "Clean up temporary files and resources"
        status: "PLANNED"
        units:
          - "cleanup.cleanup_handler"
        outputs:
          - "cleanup_log.txt"
    
    outputs:
      directory: "outputs/final"
      files:
        - "deployment_result.json"
        - "deployment_manifest.yml"

# ==============================================================================
# LIBRARIES - Reusable units organized by domain
# ==============================================================================

libraries:
  config:
    description: "Configuration loading and processing"
    location: "phases/libraries/config"
    units:
      - name: "config_loader"
        description: "Load configuration from YAML/env files"
        methods:
          - "load(path: Path) -> Dict"
          - "parse_yaml(content: str) -> Dict"
      
      - name: "config_validator"
        description: "Validate configuration completeness"
        methods:
          - "validate(config: Dict) -> ValidationResult"
          - "check_required_keys(config: Dict) -> List[str]"
      
      - name: "config_converter"
        description: "Convert between configuration formats"
        methods:
          - "to_env(config: Dict) -> str"
          - "to_yaml(config: Dict) -> str"
      
      - name: "variable_extractor"
        description: "Extract template variables from config"
        methods:
          - "extract(config: Dict) -> Dict"
      
      - name: "env_generator"
        description: "Generate .env file from configuration"
        methods:
          - "generate(config: Dict, output_path: Path)"

  docker:
    description: "Docker and Docker Compose operations"
    location: "phases/libraries/docker"
    units:
      - name: "client_wrapper"
        description: "Simplified Docker SDK interface"
        methods:
          - "is_daemon_running() -> bool"
          - "get_container_status(name: str) -> Status"
      
      - name: "compose_manager"
        description: "Docker Compose operations"
        methods:
          - "up(compose_file: Path, services: List[str])"
          - "down(remove_volumes: bool)"
      
      - name: "docker_checker"
        description: "Check Docker daemon availability"
        methods:
          - "check() -> DockerStatus"
      
      - name: "state_capturer"
        description: "Capture container states for snapshots"
        methods:
          - "capture() -> ContainerStates"
      
      - name: "image_puller"
        description: "Pull Docker images"
        methods:
          - "pull(image: str) -> PullResult"
      
      - name: "compose_executor"
        description: "Execute docker-compose commands"
        methods:
          - "execute(command: str) -> ExecutionResult"
      
      - name: "startup_monitor"
        description: "Monitor container startup"
        methods:
          - "monitor(timeout: int) -> MonitorResult"

  templates:
    description: "Template rendering with Jinja2"
    location: "phases/libraries/templates"
    units:
      - name: "jinja_renderer"
        description: "Render Jinja2 templates"
        methods:
          - "render(template: str, context: Dict) -> str"
          - "render_to_file(template: str, output: Path, context: Dict)"
      
      - name: "template_filters"
        description: "Custom Jinja2 filters"
        methods:
          - "to_bool(value: str) -> bool"
          - "to_port(value: str) -> int"
          - "to_domain(value: str) -> str"
      
      - name: "template_validator"
        description: "Validate rendered template syntax"
        methods:
          - "validate(content: str, type: str) -> ValidationResult"

  health:
    description: "Health checking and monitoring"
    location: "phases/libraries/health"
    units:
      - name: "health_checker"
        description: "Check service health"
        methods:
          - "check_service(name: str) -> HealthStatus"
          - "wait_for_healthy(services: List[str], timeout: int) -> Result"
      
      - name: "endpoint_prober"
        description: "Probe HTTP/HTTPS endpoints"
        methods:
          - "probe(url: str, timeout: int) -> ProbeResult"
      
      - name: "container_health_checker"
        description: "Check Docker container health"
        methods:
          - "check(container_id: str) -> HealthStatus"
      
      - name: "database_checker"
        description: "Check database connectivity"
        methods:
          - "check_postgres(host: str, port: int) -> DbStatus"
      
      - name: "connectivity_tester"
        description: "Test network connectivity"
        methods:
          - "test(endpoints: List[str]) -> ConnectivityResult"

  network:
    description: "Network and port operations"
    location: "phases/libraries/network"
    units:
      - name: "port_checker"
        description: "Check port availability"
        methods:
          - "is_port_available(port: int) -> bool"
          - "check_ports(ports: List[int]) -> PortStatus"

  system:
    description: "System resource checking"
    location: "phases/libraries/system"
    units:
      - name: "resource_checker"
        description: "Check system resources"
        methods:
          - "check_memory() -> MemoryStatus"
          - "check_disk() -> DiskStatus"
          - "check_cpu() -> CpuStatus"

  snapshot:
    description: "Snapshot and rollback operations"
    location: "phases/libraries/snapshot"
    units:
      - name: "config_backupper"
        description: "Backup configuration files"
        methods:
          - "backup(files: List[Path], output_dir: Path)"
      
      - name: "snapshot_storer"
        description: "Store and manage snapshots"
        methods:
          - "store(snapshot: Snapshot) -> str"
          - "load(snapshot_id: str) -> Snapshot"
          - "list() -> List[Snapshot]"

  prober:
    description: "Integration with docker-prober-utility"
    location: "phases/libraries/prober"
    units:
      - name: "prober_runner"
        description: "Run prober preflight checks"
        methods:
          - "run_preflight(config: Dict) -> ProberResult"

  reporting:
    description: "Reporting and logging"
    location: "phases/libraries/reporting"
    units:
      - name: "status_reporter"
        description: "Report deployment status"
        methods:
          - "report(result: DeploymentResult) -> str"
      
      - name: "metadata_logger"
        description: "Log deployment metadata"
        methods:
          - "log(metadata: Dict, output: Path)"

  cleanup:
    description: "Cleanup operations"
    location: "phases/libraries/cleanup"
    units:
      - name: "cleanup_handler"
        description: "Clean up temporary files"
        methods:
          - "cleanup(temp_dir: Path)"

# ==============================================================================
# ENTRY POINTS - CLI and programmatic interfaces
# ==============================================================================

entry_points:
  cli:
    status: "PLANNED"
    description: "Main deployment CLI entry point"
    commands:
      - "deploy"
      - "rollback"
      - "health"
      - "validate"
      - "template"
      - "status"
  
  deploy:
    status: "PLANNED"
    description: "Run complete deployment orchestration"
    flow: "main_deployment_flow"
    
  rollback:
    status: "PLANNED"
    description: "Rollback to previous deployment snapshot"
    flow: "rollback_flow"
    
  health:
    status: "PLANNED"
    description: "Check deployment health"
    phases:
      - "phase_5_health_verification"
    
  validate:
    status: "PLANNED"
    description: "Validate deployment configuration"
    phases:
      - "phase_1_preflight"
    
  template:
    status: "PLANNED"
    description: "Render deployment templates"
    phases:
      - "phase_2_template_rendering"
    
  status:
    status: "PLANNED"
    description: "Check deployment status"
    phases:
      - "phase_6_post_deployment"

# ==============================================================================
# FLOWS - High-level workflow definitions
# ==============================================================================

flows:
  main_deployment_flow:
    description: "Complete deployment workflow"
    phases:
      - "phase_1_preflight"
      - "phase_2_template_rendering"
      - "phase_3_snapshot"
      - "phase_4_deployment"
      - "phase_5_health_verification"
      - "phase_6_post_deployment"
    
  rollback_flow:
    description: "Rollback to previous deployment"
    steps:
      - "Load latest snapshot"
      - "Stop current deployment"
      - "Restore snapshot configuration"
      - "Start previous deployment"
      - "Verify rollback health"
  
  validation_only_flow:
    description: "Validate without deploying"
    phases:
      - "phase_1_preflight"
      - "phase_2_template_rendering"

# ==============================================================================
# METADATA
# ==============================================================================

implementation_status:
  overall: "PLANNED"
  last_updated: "2025-10-15"
  notes: "Complete specification ready for scaffolding"
  
design:
  pattern: "phase-step-unit"
  phase_count: 6
  total_steps: 24
  library_domains: 11
  total_units: 34

dependencies:
  external:
    - name: "docker"
      version: ">=7.0.0"
      purpose: "Container management"
    
    - name: "docker-compose"
      version: ">=2.0.0"
      purpose: "Multi-container orchestration"
    
    - name: "jinja2"
      version: ">=3.0.0"
      purpose: "Template rendering"
    
    - name: "click"
      version: ">=8.0.0"
      purpose: "CLI framework"
    
    - name: "rich"
      version: ">=13.0.0"
      purpose: "Terminal formatting"
    
    - name: "pyyaml"
      version: ">=6.0.0"
      purpose: "YAML processing"
  
  optional:
    - name: "docker-prober-utility"
      purpose: "Preflight validation"

configuration:
  input_format: "YAML"
  input_source: "config-manager Phase 5 export (collected_configuration.yml)"
  output_formats:
    - ".env"
    - "YAML"
    - "JSON"
  
rollback:
  snapshot_before_deploy: true
  default_mode: "manual"
  auto_rollback_available: true
  snapshot_retention: 10

health_checks:
  timeout_seconds: 300
  retry_strategy: "exponential_backoff"
  levels:
    - "docker_health"
    - "http_endpoints"
    - "database_connectivity"
    - "network_connectivity"
